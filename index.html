
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">
<title>7 Marts Search</title>
<meta name="description" content="Search the web and discover products with 7 Marts Search.">
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b14;color:#f4f6ff;font-family:Arial,sans-serif;min-height:100vh}
header{padding:22px 18px;text-align:center}
.brand{font-size:29px;font-weight:800;letter-spacing:-1px}
.brand span{color:#65a6ff}
.tagline{color:#9ca9c4;font-size:13px;margin-top:8px}
main{max-width:760px;margin:65px auto 0;padding:18px}
h1{text-align:center;font-size:clamp(28px,6vw,43px);margin-bottom:12px}
.sub{text-align:center;color:#9ca9c4;margin-bottom:30px}
.tabs{display:flex;justify-content:center;gap:10px;margin-bottom:18px}
.tab{border:1px solid #28334c;border-radius:24px;background:#111827;color:#dce5fa;padding:11px 22px;font-size:14px;cursor:pointer}
.tab.active{background:#2563eb;border-color:#2563eb;color:white}
.search{display:flex;gap:8px;padding:7px;border:1px solid #34415c;background:#111827;border-radius:18px}
input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:white;font-size:16px;padding:12px}
input::placeholder{color:#8996b1}
#go{border:0;border-radius:12px;background:#3678f6;color:white;font-weight:bold;padding:0 20px;cursor:pointer}
.hint{text-align:center;color:#8190ad;font-size:12px;margin:15px 0 28px}
#status{color:#9ca9c4;font-size:14px;margin:20px 4px}
#results{display:grid;gap:12px}
.result{padding:17px;border:1px solid #26324a;background:#101725;border-radius:14px;overflow-wrap:anywhere}
.result a{color:#83b6ff;text-decoration:none;font-size:17px;font-weight:bold}
.result a:hover{text-decoration:underline}
.result p{color:#c1cbe0;font-size:14px;line-height:1.6;margin-bottom:0}
.url{color:#7ed9b1;font-size:12px;margin-bottom:9px}
footer{text-align:center;color:#76839e;font-size:12px;padding:45px 15px}
.small{font-size:12px;color:#91a0bc}
@media(max-width:480px){main{margin-top:35px;padding:14px}.brand{font-size:25px}#go{padding:0 15px}}
</style>
</head>
<body>
<header>
  <div class="brand">7 Marts <span>Search</span></div>
  <div class="tagline">Discover more. Find what matters.</div>
</header>

<main>
  <h1>Search your world.</h1>
  <div class="sub">Explore information and discover products.</div>

  <div class="tabs">
    <button class="tab active" id="webTab" type="button">🌐 Web</button>
    <button class="tab" id="productTab" type="button">🛍️ Products</button>
  </div>

  <form class="search" id="searchForm">
    <input id="query" type="search" placeholder="Search the web..." aria-label="Search" required>
    <button id="go" type="submit">Search</button>
  </form>
  <div class="hint" id="hint">Search articles and information from Wikipedia.</div>
  <div id="status" aria-live="polite">Welcome to 7 Marts Search.</div>
  <div id="results"></div>
</main>

<footer>
  7 Marts Search · Built for curious minds
  <p class="small">Web demo powered by Wikipedia. Product links open Amazon India.</p>
</footer>

<script>
const form = document.getElementById('searchForm');
const input = document.getElementById('query');
const results = document.getElementById('results');
const status = document.getElementById('status');
const webTab = document.getElementById('webTab');
const productTab = document.getElementById('productTab');
const hint = document.getElementById('hint');
let mode = 'web';

function setMode(next) {
  mode = next;
  webTab.classList.toggle('active', mode === 'web');
  productTab.classList.toggle('active', mode === 'products');
  input.placeholder = mode === 'web' ? 'Search the web...' : 'Search products and deals...';
  hint.textContent = mode === 'web'
    ? 'Search articles and information from Wikipedia.'
    : 'Discover products on Amazon India.';
  results.replaceChildren();
  status.textContent = mode === 'web'
    ? 'Ready to search the web demo.'
    : 'Ready to find products.';
}

webTab.addEventListener('click', () => setMode('web'));
productTab.addEventListener('click', () => setMode('products'));

function addResult(title, url, description, label) {
  const card = document.createElement('article');
  card.className = 'result';
  const source = document.createElement('div');
  source.className = 'url';
  source.textContent = label || url;
  const link = document.createElement('a');
  link.href = url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.textContent = title;
  const p = document.createElement('p');
  p.textContent = description || 'Open this result to learn more.';
  card.append(source, link, p);
  results.append(card);
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const q = input.value.trim();
  if (!q) return;

  results.replaceChildren();
  status.textContent = 'Searching...';

  if (mode === 'products') {
    const url = 'https://www.amazon.in/s?k=' + encodeURIComponent(q);
    addResult('Find "' + q + '" on Amazon India', url,
      'Browse matching products, prices and available deals on Amazon India.',
      'Amazon.in · Product search');
    addResult('Search "' + q + '" on 7 Marts Marketing',
      'https://residentmarketing.lovable.app/?q=' + encodeURIComponent(q),
      'Visit the 7 Marts Marketing website to explore its product recommendations.',
      '7 Marts Marketing');
    status.textContent = 'Product search links are ready.';
    return;
  }

  try {
    const api = 'https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='
      + encodeURIComponent(q)
      + '&gsrnamespace=0&gsrlimit=10&prop=extracts&exintro=1&explaintext=1&exsentences=2&format=json&origin=*';

    const response = await fetch(api);
    if (!response.ok) throw new Error('Search request failed');
    const data = await response.json();
    const pages = Object.values(data.query?.pages || {})
      .sort((a, b) => (a.index || 0) - (b.index || 0));

    if (!pages.length) {
      status.textContent = 'No Wikipedia results found. Try another search.';
      return;
    }

    for (const page of pages) {
      addResult(page.title,
        'https://en.wikipedia.org/?curid=' + page.pageid,
        page.extract || 'Open this article to read more.',
        'Wikipedia article');
    }
    status.textContent = 'Found ' + pages.length + ' results.';
  } catch (error) {
    status.textContent = 'Could not load results. Check your internet connection and try again.';
  }
});
</script>
</body>
</html>
